[package]
name = "esp32_cam_sec"
version = "0.1.0"
authors = ["Victor"]
edition = "2021"
resolver = "2"
rust-version = "1.77"

[package.metadata.esp-idf-sys]
extra_components = [
    { path = "components/esp32-camera" }
]

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[features]
default = []

[dependencies]
log = "0.4"
esp-idf-svc = { version = "0.52", features = ["critical-section"] }
esp-idf-hal = "0.46"
esp-idf-sys = { version = "0.37", features = ["binstart"] }
esp32-nimble = "0.12.0"
anyhow = "1.0"
embedded-hal = "1.0.0"

[build-dependencies]
embuild = { version = "0.32", features = ["espidf"] }
bindgen = "0.70.1"
cc = "1.0"
